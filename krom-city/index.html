<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050305">
<meta name="color-scheme" content="dark">
<title>KROM DIGITAL // Fondo Futurista</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap">

</head>
<body>
<main id="scene" aria-label="Fondo futurista Krom Digital">
<div class="fx vig"></div><div class="fx scan"></div>
<header class="hud top"><span class="brand"><i class="kd">KD</i><span><b>KROM DIGITAL</b> // NEO GDL</span></span><span class="on">● SYSTEM ONLINE</span></header>

<section class="hud bot">
<div class="coord">20°40′N&nbsp; 103°21′W</div>
<div class="warn"><span class="dot"></span>SECTOR KROM // ALERTA ALTA</div>
<div class="meter" id="meter"></div>
<div class="foot"><span><b>KROM DIGITAL</b> // kromdigital.com.mx</span><span>@krom_digital_</span></div>
</section>
<div class="ctl"><button id="bf" title="Pantalla completa (F)">⛶</button><button id="bh" title="Ocultar interfaz (H)">HUD</button></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
